name: SGP2RR search unit tests

on:
  pull_request:
    paths:
      - "integrations/sgp2rr-canaime/**"
      - ".github/workflows/sgp2rr-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline unit tests
        run: |
          cd integrations/sgp2rr-canaime/server-extension
          python -m compileall -q sgp2rr_search.py sgp2rr_tools.py sgp2rr_integration.py sgp2rr_server_bridge.py prepare_integration.py
          python -m unittest discover -s tests -v
